[project]
name = "project-rock-backend"
version = "0.1.0"
description = "Backend API for Project Rock"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "pydantic-settings>=2.10.0",

    # Database
    "sqlalchemy>=2.0.43",
    "psycopg[binary]>=3.2.9",
    "alembic>=1.16.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "httpx>=0.28.0",
    "ruff>=0.12.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
